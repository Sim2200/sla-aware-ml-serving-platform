apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: high-model-hpa
  namespace: sla-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: high-model
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 10
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 20
---
